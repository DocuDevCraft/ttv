version: '3.8'

services:
  torrent-backend:
    build: .
    container_name: torrent-backend
    restart: unless-stopped
    ports:
      - "2096:2096"
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
      # Certs volume removed as we are now HTTP
    environment:
      - PORT=2096
      - NODE_ENV=production
    healthcheck:
      # Updated healthcheck for HTTP
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:2096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
