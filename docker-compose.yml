version: '3.8'

services:
  torrent-backend:
    build: .
    container_name: torrent-backend
    restart: unless-stopped
    ports:
      - "2096:2096"
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
      - ./certs:/app/certs
    environment:
      - PORT=2096
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:2096/health"]
      interval: 30s
      timeout: 10s
      retries: 3
