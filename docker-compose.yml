version: '3.8'

services:
  torrent-backend:
    build: .
    container_name: torrent-backend
    restart: unless-stopped
    ports:
      - "2096:2096"
    volumes:
      - ./downloads:/downloads
      - ./data:/app/data
      - ./certs:/app/certs
    environment:
      - PORT=2096
      - NODE_ENV=production
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--no-check-certificate", "https://localhost:2096/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  torrent-frontend:
    # Basic dev server for now. In prod, we'd build and serve via Nginx.
    # Using node alpine to run "npm run dev" or serve build.
    image: node:20-alpine
    container_name: torrent-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    # Need to expose 5173 for Vite dev server
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true # Better for watching files in docker
    command: sh -c "npm install && npm run dev -- --host"
